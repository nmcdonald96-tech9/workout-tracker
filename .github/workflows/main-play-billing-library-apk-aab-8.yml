name: Build Permanently Signed IronCycle APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  FLET_SKIP_FLUTTER_PROMPT: "true"
  SERIOUS_PYTHON_VERSION: "3.12"
  EXPECTED_PACKAGE_ID: "com.ironcycle.myapp"
  EXPECTED_PROJECT: "myapp"
  EXPECTED_ORG: "com.ironcycle"

jobs:
  build:
    name: Build and verify APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install "flet==0.86.5" "msal>=1.31,<2"
          fi

      - name: Verify required repository secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_EXPECTED_SIGNER_SHA256: ${{ secrets.ANDROID_EXPECTED_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            ANDROID_EXPECTED_SIGNER_SHA256
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if [ "$ANDROID_KEY_ALIAS" != "ironcycle" ]; then
            echo "::error::ANDROID_KEY_ALIAS must be ironcycle."
            exit 1
          fi

      - name: Restore permanent release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/ironcycle-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Validate permanent keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Permanent keystore and alias validated."

      - name: Python syntax check
        shell: bash
        run: |
          set -euo pipefail
          files=(main.py database.py)
          for optional in constants.py exercise_catalog.py onedrive_service.py; do
            if [ -f "$optional" ]; then
              files+=("$optional")
            fi
          done
          while IFS= read -r module; do
            files+=("$module")
          done < <(find app components services -type f -name '*.py' -print 2>/dev/null | sort)
          python -m py_compile "${files[@]}"

      - name: Read IronCycle version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("constants.py").read_text(encoding="utf-8")
          match = re.search(r'^APP_VERSION\s*=\s*["\']([^"\']+)["\']', text, re.MULTILINE)
          if not match:
              raise SystemExit("APP_VERSION was not found in constants.py")
          print(match.group(1))
          PY
          )"
          if ! printf '%s' "$APP_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::APP_VERSION must use major.minor.patch format. Found: $APP_VERSION"
            exit 1
          fi
          ANDROID_VERSION_CODE=$((400000 + GITHUB_RUN_NUMBER))
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$ANDROID_VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building IronCycle $APP_VERSION with Android version code $ANDROID_VERSION_CODE"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: false

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Reclaim GitHub runner disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk usage before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          docker system prune --all --force --volumes || true
          sudo apt-get clean
          echo "Disk usage after cleanup:"
          df -h /

      - name: Build permanently signed APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flet build apk \
            --yes \
            --product "IronCycle" \
            --project "$EXPECTED_PROJECT" \
            --org "$EXPECTED_ORG" \
            --bundle-id "$EXPECTED_PACKAGE_ID" \
            --build-version "$APP_VERSION" \
            --build-number "$ANDROID_VERSION_CODE" \
            --android-permissions "com.android.vending.BILLING=True" \
            --android-signing-key-store "$KEYSTORE_PATH" \
            --android-signing-key-store-password "$ANDROID_KEYSTORE_PASSWORD" \
            --android-signing-key-alias "$ANDROID_KEY_ALIAS" \
            --android-signing-key-password "$ANDROID_KEY_PASSWORD"

      - name: Add Google Play Billing Library 8 with Gradle init script
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_PROJECT="build/flutter/android"
          if [ ! -d "$ANDROID_PROJECT/app" ]; then
            echo "::error::Generated Flet Android project was not found."
            exit 1
          fi
          INIT_SCRIPT="$RUNNER_TEMP/ironcycle-billing.init.gradle.kts"
          cat > "$INIT_SCRIPT" <<'EOF'
          gradle.projectsEvaluated {
              project(":app").dependencies.add(
                  "implementation",
                  "com.android.billingclient:billing:8.0.0"
              )
          }
          EOF
          cd "$ANDROID_PROJECT"
          ./gradlew -I "$INIT_SCRIPT" app:dependencies --configuration releaseRuntimeClasspath > "$RUNNER_TEMP/release-dependencies.txt"
          grep -F "com.android.billingclient:billing:8.0.0" "$RUNNER_TEMP/release-dependencies.txt"
          ./gradlew -I "$INIT_SCRIPT" assembleRelease
          cd "$GITHUB_WORKSPACE"
          echo "Billing Library 8.0.0 resolved and APK rebuilt without editing build.gradle.kts."
      - name: Locate APK and Android tools
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find build -type f -name '*.apk' -print | head -n 1)"
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::No APK was found under the build directory."
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner was not found."
            exit 1
          fi
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer -print | head -n 1)"
          if [ -z "$APKANALYZER" ] || [ ! -x "$APKANALYZER" ]; then
            echo "::error::apkanalyzer was not found."
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
          echo "APKANALYZER=$APKANALYZER" >> "$GITHUB_ENV"

      - name: Verify APK signature and permanent signer
        shell: bash
        env:
          ANDROID_EXPECTED_SIGNER_SHA256: ${{ secrets.ANDROID_EXPECTED_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" | tee "$RUNNER_TEMP/apksigner-report.txt"

          ACTUAL_SHA256="$(
            sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner-report.txt" |
              head -n 1 |
              tr -d ':[:space:]' |
              tr '[:lower:]' '[:upper:]'
          )"
          EXPECTED_SHA256="$(
            printf '%s' "$ANDROID_EXPECTED_SIGNER_SHA256" |
              tr -d ':[:space:]' |
              tr '[:lower:]' '[:upper:]'
          )"

          if [ -z "$ACTUAL_SHA256" ]; then
            echo "::error::Could not extract the APK signer SHA-256 fingerprint."
            exit 1
          fi
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::APK signer mismatch. The APK was not signed by the permanent IronCycle key."
            exit 1
          fi
          echo "ACTUAL_SIGNER_SHA256=$ACTUAL_SHA256" >> "$GITHUB_ENV"
          echo "Permanent signer verified."

      - name: Verify package ID and version metadata
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_PACKAGE_ID="$("$APKANALYZER" manifest application-id "$APK_PATH" | tr -d '\r\n')"
          ACTUAL_VERSION_NAME="$("$APKANALYZER" manifest version-name "$APK_PATH" | tr -d '\r\n')"
          ACTUAL_VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK_PATH" | tr -d '\r\n')"

          if [ "$ACTUAL_PACKAGE_ID" != "$EXPECTED_PACKAGE_ID" ]; then
            echo "::error::Package ID mismatch. Expected $EXPECTED_PACKAGE_ID but found $ACTUAL_PACKAGE_ID."
            exit 1
          fi
          if [ "$ACTUAL_VERSION_NAME" != "$APP_VERSION" ]; then
            echo "::error::Version name mismatch. Expected $APP_VERSION but found $ACTUAL_VERSION_NAME."
            exit 1
          fi
          if [ "$ACTUAL_VERSION_CODE" != "$ANDROID_VERSION_CODE" ]; then
            echo "::error::Version code mismatch. Expected $ANDROID_VERSION_CODE but found $ACTUAL_VERSION_CODE."
            exit 1
          fi

          echo "ACTUAL_PACKAGE_ID=$ACTUAL_PACKAGE_ID" >> "$GITHUB_ENV"
          echo "ACTUAL_VERSION_NAME=$ACTUAL_VERSION_NAME" >> "$GITHUB_ENV"
          echo "ACTUAL_VERSION_CODE=$ACTUAL_VERSION_CODE" >> "$GITHUB_ENV"
          APK_PERMISSIONS="$($APKANALYZER manifest permissions "$APK_PATH")"
          printf '%s\n' "$APK_PERMISSIONS" | grep -F "com.android.vending.BILLING" >/dev/null || {
            echo "::error::APK manifest is missing com.android.vending.BILLING."
            exit 1
          }
          echo "Billing permission verified in APK manifest."

      - name: Calculate Microsoft Entra signature hash
        shell: bash
        run: |
          set -euo pipefail
          SHA1_HEX="$(
            sed -n 's/^.*certificate SHA-1 digest: //p' "$RUNNER_TEMP/apksigner-report.txt" |
              head -n 1 |
              tr -d ':[:space:]'
          )"
          if [ -z "$SHA1_HEX" ]; then
            echo "::error::Could not extract the certificate SHA-1 digest."
            exit 1
          fi
          ENTRA_SIGNATURE_HASH="$(printf '%s' "$SHA1_HEX" | xxd -r -p | openssl base64 -A)"
          echo "ENTRA_SIGNATURE_HASH=$ENTRA_SIGNATURE_HASH" >> "$GITHUB_ENV"

      - name: Create release verification report
        shell: bash
        run: |
          set -euo pipefail
          cat > IronCycle_APK_Verification.txt <<EOF
          IronCycle APK Release Verification

          Version name:       $ACTUAL_VERSION_NAME
          Version code:       $ACTUAL_VERSION_CODE
          Package ID:         $ACTUAL_PACKAGE_ID
          Signer SHA-256:     $ACTUAL_SIGNER_SHA256
          APK signature:      Verified
          Permanent signer:   Verified
          Update compatible:  Yes, for APKs installed from this permanent-key baseline or later

          Microsoft Entra Android configuration
          Package name:       $ACTUAL_PACKAGE_ID
          Signature hash:     $ENTRA_SIGNATURE_HASH
          EOF
          cat IronCycle_APK_Verification.txt

      - name: Rename verified APK
        shell: bash
        run: |
          set -euo pipefail
          VERIFIED_APK="IronCycle-${APP_VERSION}-permanent-signed.apk"
          cp "$APK_PATH" "$VERIFIED_APK"
          echo "VERIFIED_APK=$VERIFIED_APK" >> "$GITHUB_ENV"

      - name: Build signed AAB with Billing Library 8
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_PROJECT="build/flutter/android"
          INIT_SCRIPT="$RUNNER_TEMP/ironcycle-billing.init.gradle.kts"
          cd "$ANDROID_PROJECT"
          ./gradlew -I "$INIT_SCRIPT" bundleRelease
          cd "$GITHUB_WORKSPACE"
          echo "AAB built with Billing Library 8.0.0 injected through Gradle configuration."
      - name: Locate and verify AAB signature
        shell: bash
        run: |
          set -euo pipefail
          AAB_PATH="$(find build -type f -name '*.aab' -print | head -n 1)"
          if [ -z "$AAB_PATH" ] || [ ! -f "$AAB_PATH" ]; then
            echo "::error::No AAB was found under the build directory."
            exit 1
          fi
          jarsigner -verify -verbose -certs "$AAB_PATH" > "$RUNNER_TEMP/jarsigner-aab-report.txt"
          VERIFIED_AAB="IronCycle-${APP_VERSION}-play-upload.aab"
          cp "$AAB_PATH" "$VERIFIED_AAB"
          echo "VERIFIED_AAB=$VERIFIED_AAB" >> "$GITHUB_ENV"
          echo "AAB signature verified."

      - name: Create AAB verification report
        shell: bash
        run: |
          set -euo pipefail
          cat > IronCycle_AAB_Verification.txt <<EOF
          IronCycle AAB Release Verification
          Version name:       $APP_VERSION
          Version code:       $ANDROID_VERSION_CODE
          Package ID:         $EXPECTED_PACKAGE_ID
          Upload signer:      Permanent IronCycle key
          Signer SHA-256:     $ACTUAL_SIGNER_SHA256
          AAB signature:      Verified
          Intended use:       Google Play Console upload
          EOF

      - name: Upload verified APK, AAB, and reports
        uses: actions/upload-artifact@v4
        with:
          name: IronCycle-${{ env.APP_VERSION }}-signed-android
          path: |
            ${{ env.VERIFIED_APK }}
            ${{ env.VERIFIED_AAB }}
            IronCycle_APK_Verification.txt
            IronCycle_AAB_Verification.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: |
          rm -f "${KEYSTORE_PATH:-}"
