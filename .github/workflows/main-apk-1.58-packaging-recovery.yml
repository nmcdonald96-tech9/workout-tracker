name: Build IronCycle APK - 1.58 packaging recovery

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  FLET_SKIP_FLUTTER_PROMPT: "true"
  EXPECTED_PACKAGE_ID: "com.ironcycle.myapp"
  EXPECTED_PROJECT: "myapp"
  EXPECTED_ORG: "com.ironcycle"

jobs:
  build:
    name: Build and verify recovery APK
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build local billing extension wheel and prepare requirements
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build wheel
          mkdir -p "$GITHUB_WORKSPACE/dist"
          python -m pip wheel \
            "$GITHUB_WORKSPACE/packages/ironcycle-billing" \
            --no-deps \
            --wheel-dir "$GITHUB_WORKSPACE/dist"

          BILLING_WHEEL="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name 'ironcycle_billing-*.whl' -print -quit)"
          if [ -z "$BILLING_WHEEL" ] || [ ! -f "$BILLING_WHEEL" ]; then
            echo "::error::IronCycle billing extension wheel was not created."
            exit 1
          fi

          unzip -l "$BILLING_WHEEL" | tee "$RUNNER_TEMP/billing-wheel.txt"
          grep -F 'ironcycle_billing/flutter/ironcycle_billing/pubspec.yaml' "$RUNNER_TEMP/billing-wheel.txt"
          grep -F 'ironcycle_billing/flutter/ironcycle_billing/lib/src/extension.dart' "$RUNNER_TEMP/billing-wheel.txt"
          grep -F 'ironcycle_billing/flutter/ironcycle_billing/lib/src/billing.dart' "$RUNNER_TEMP/billing-wheel.txt"

          export BILLING_WHEEL
          python - <<'PY'
          import os
          from pathlib import Path

          requirements = Path("requirements.txt")
          if not requirements.exists():
              raise SystemExit("requirements.txt was not found")

          wheel_uri = Path(os.environ["BILLING_WHEEL"]).resolve().as_uri()
          rows = []
          for row in requirements.read_text(encoding="utf-8").splitlines():
              stripped = row.strip()
              if stripped in {"./packages/ironcycle-billing", "packages/ironcycle-billing"}:
                  continue
              if stripped.lower().startswith("ironcycle-billing @"):
                  continue
              rows.append(row)
          rows.append(f"ironcycle-billing @ {wheel_uri}")
          requirements.write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY

          echo "Resolved build requirements:"
          cat requirements.txt
          echo "BILLING_WHEEL=$BILLING_WHEEL" >> "$GITHUB_ENV"

      - name: Install and verify build-host dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python - <<'PY'
          import cryptography
          import jwt
          import msal
          import requests
          import ironcycle_billing

          print("msal", getattr(msal, "__version__", "unknown"))
          print("requests", getattr(requests, "__version__", "unknown"))
          print("PyJWT", getattr(jwt, "__version__", "unknown"))
          print("cryptography", getattr(cryptography, "__version__", "unknown"))
          print("ironcycle_billing", ironcycle_billing.__file__)
          PY

      - name: Verify source and read application version
        shell: bash
        run: |
          set -euo pipefail
          files=(main.py database.py)
          for optional in constants.py exercise_catalog.py onboarding_catalog.py onedrive_service.py ironcycle_billing.py; do
            [ ! -f "$optional" ] || files+=("$optional")
          done
          while IFS= read -r module; do files+=("$module"); done < <(find app components services -type f -name '*.py' -print 2>/dev/null | sort)
          python -m py_compile "${files[@]}"

          APP_VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("constants.py").read_text(encoding="utf-8")
          match = re.search(r'^APP_VERSION\s*=\s*["\x27]([^"\x27]+)["\x27]', text, re.MULTILINE)
          if not match:
              raise SystemExit("APP_VERSION was not found in constants.py")
          print(match.group(1))
          PY
          )"
          ANDROID_VERSION_CODE=$((1200000 + GITHUB_RUN_NUMBER))
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$ANDROID_VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building IronCycle $APP_VERSION with version code $ANDROID_VERSION_CODE"

      - name: Validate signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_EXPECTED_SIGNER_SHA256: ${{ secrets.ANDROID_EXPECTED_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_EXPECTED_SIGNER_SHA256; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Restore and verify permanent keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/ironcycle-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: false

      - name: Accept Android licenses and reclaim disk space
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          docker system prune --all --force --volumes || true
          sudo apt-get clean
          df -h /

      - name: Build recovery APK using 1.58 Python-selection behavior
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Intentionally omit --python-version. This isolates the main packaging
          # difference between the functional 1.58 workflow and the failing build.
          flet build apk \
            --yes \
            --product "IronCycle" \
            --project "$EXPECTED_PROJECT" \
            --org "$EXPECTED_ORG" \
            --bundle-id "$EXPECTED_PACKAGE_ID" \
            --build-version "$APP_VERSION" \
            --build-number "$ANDROID_VERSION_CODE" \
            --android-permissions "com.android.vending.BILLING=True" \
            --android-signing-key-store "$KEYSTORE_PATH" \
            --android-signing-key-store-password "$ANDROID_KEYSTORE_PASSWORD" \
            --android-signing-key-alias "$ANDROID_KEY_ALIAS" \
            --android-signing-key-password "$ANDROID_KEY_PASSWORD"

      - name: Locate APK and Android tools
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find build -type f -name '*.apk' -print | head -n 1)"
          test -n "$APK_PATH"
          test -f "$APK_PATH"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
          echo "AAPT=$AAPT" >> "$GITHUB_ENV"

      - name: Hard-check packaged Python and billing dependencies
        shell: bash
        run: |
          set -euo pipefail
          export APK_PATH
          python - <<'PY'
          from __future__ import annotations

          import io
          import os
          import zipfile
          from pathlib import PurePosixPath

          apk = os.environ["APK_PATH"]
          required = {
              "msal": False,
              "requests": False,
              "jwt": False,
              "cryptography": False,
              "billing_pubspec": False,
              "billing_extension": False,
          }
          visited = 0
          evidence = []

          def inspect_zip(data: bytes, label: str, depth: int = 0) -> None:
              global visited
              if depth > 5:
                  return
              try:
                  archive = zipfile.ZipFile(io.BytesIO(data))
              except zipfile.BadZipFile:
                  return
              with archive:
                  for info in archive.infolist():
                      visited += 1
                      name = info.filename.replace("\\", "/")
                      lowered = "/" + name.lower().lstrip("/")
                      parts = {part.lower() for part in PurePosixPath(name).parts}

                      checks = {
                          "msal": "msal" in parts or "/msal-" in lowered,
                          "requests": "requests" in parts or "/requests-" in lowered,
                          "jwt": "jwt" in parts or "/pyjwt-" in lowered,
                          "cryptography": "cryptography" in parts or "/cryptography-" in lowered,
                          "billing_pubspec": name.endswith("ironcycle_billing/flutter/ironcycle_billing/pubspec.yaml"),
                          "billing_extension": name.endswith("ironcycle_billing/flutter/ironcycle_billing/lib/src/extension.dart"),
                      }
                      for key, hit in checks.items():
                          if hit and not required[key]:
                              required[key] = True
                              evidence.append(f"{key}: {label}!/{name}")

                      if info.file_size <= 120_000_000 and (
                          name.lower().endswith((".zip", ".whl", ".apk"))
                          or info.filename.lower().endswith("sitepackages")
                      ):
                          try:
                              nested = archive.read(info)
                          except Exception:
                              continue
                          if nested[:4] == b"PK\x03\x04":
                              inspect_zip(nested, f"{label}!/{name}", depth + 1)

          with open(apk, "rb") as handle:
              inspect_zip(handle.read(), apk)

          print(f"Inspected {visited} archive entries")
          for line in evidence:
              print(line)
          print("Results:", required)

          missing = [name for name, found in required.items() if not found]
          if missing:
              raise SystemExit("Required Android package evidence is missing: " + ", ".join(missing))
          PY

      - name: Verify APK identity, billing permission, and permanent signer
        shell: bash
        env:
          ANDROID_EXPECTED_SIGNER_SHA256: ${{ secrets.ANDROID_EXPECTED_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" 2>&1 | tee "$RUNNER_TEMP/apk-verify.txt"
          EXPECTED="$(printf '%s' "$ANDROID_EXPECTED_SIGNER_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          ACTUAL="$(grep -m1 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/apk-verify.txt" | awk -F': ' '{print $2}' | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          if [ -z "$ACTUAL" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::APK permanent signer verification failed."
            exit 1
          fi

          "$AAPT" dump badging "$APK_PATH" > "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='$EXPECTED_PACKAGE_ID'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "versionName='$APP_VERSION'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "versionCode='$ANDROID_VERSION_CODE'" "$RUNNER_TEMP/apk-badging.txt"
          "$AAPT" dump permissions "$APK_PATH" | grep -F 'com.android.vending.BILLING'

          VERIFIED_APK="$GITHUB_WORKSPACE/IronCycle-${APP_VERSION}-recovery-permanent-signed.apk"
          cp "$APK_PATH" "$VERIFIED_APK"
          echo "VERIFIED_APK=$VERIFIED_APK" >> "$GITHUB_ENV"

      - name: Create verification report
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "IronCycle 1.58-packaging recovery verification"
            echo "Source ref: $GITHUB_REF_NAME"
            echo "Source commit: $GITHUB_SHA"
            echo "Version: $APP_VERSION"
            echo "Version code: $ANDROID_VERSION_CODE"
            echo "Package: $EXPECTED_PACKAGE_ID"
            echo "Python version flag: intentionally omitted"
            echo "Required packaged modules: msal, requests, jwt, cryptography"
            echo "Billing extension assets: verified"
            echo "Permanent signer: verified"
            echo
            cat "$RUNNER_TEMP/apk-verify.txt"
            echo
            cat "$RUNNER_TEMP/apk-badging.txt"
          } > IronCycle_Recovery_Verification.txt

      - name: Upload verified recovery APK
        uses: actions/upload-artifact@v4
        with:
          name: IronCycle-${{ env.APP_VERSION }}-recovery-apk
          path: |
            ${{ env.VERIFIED_APK }}
            IronCycle_Recovery_Verification.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "${{ env.KEYSTORE_PATH }}"
