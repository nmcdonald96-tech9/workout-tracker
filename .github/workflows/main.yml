name: Build APK

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FLET_SKIP_FLUTTER_PROMPT: "true"
  SERIOUS_PYTHON_VERSION: "3.12"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install flet
          fi

      - name: Python syntax check
        run: |
          python -m py_compile main.py database.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build APK
        run: |
          flet build apk --yes --product "IronCycle"

      - name: Print package name and Microsoft Entra signature hash
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$(find . -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK file was found."
            exit 1
          fi

          echo "APK found at: $APK_PATH"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found."
            exit 1
          fi

          echo ""
          echo "----- APK CERTIFICATE INFORMATION -----"
          "$APKSIGNER" verify --print-certs "$APK_PATH"
          echo "----- END CERTIFICATE INFORMATION -----"

          SHA1_HEX="$(
            "$APKSIGNER" verify --print-certs "$APK_PATH" \
              | sed -n 's/^Signer #1 certificate SHA-1 digest: //p' \
              | head -n 1 \
              | tr -d ':[:space:]'
          )"

          if [ -z "$SHA1_HEX" ]; then
            echo "::error::Could not extract the certificate SHA-1 digest."
            exit 1
          fi

          SIGNATURE_HASH="$(
            printf '%s' "$SHA1_HEX" \
              | xxd -r -p \
              | openssl base64 -A
          )"

          echo ""
          echo "----- MICROSOFT ENTRA SIGNATURE HASH -----"
          echo "$SIGNATURE_HASH"
          echo "----- END MICROSOFT ENTRA SIGNATURE HASH -----"

          echo ""
          echo "Microsoft Entra Android configuration:"
          echo "Package name: com.flet.workout_tracker"
          echo "Signature hash: $SIGNATURE_HASH"

          echo "ENTRA_SIGNATURE_HASH=$SIGNATURE_HASH" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: "**/*.apk"
