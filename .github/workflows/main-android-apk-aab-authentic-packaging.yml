name: Build IronCycle Android APK and AAB with authentic packaging

on:
  workflow_dispatch:

concurrency:
  group: ironcycle-apk-aab-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_PACKAGE_ID: com.ironcycle.myapp

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Capture source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          git rev-parse HEAD > release-evidence/SOURCE_COMMIT.txt
          git show -s --format=%cI HEAD > release-evidence/SOURCE_COMMIT_DATE.txt
          git ls-files -z | LC_ALL=C sort -z | xargs -0 sha256sum > release-evidence/SOURCE_FILE_SHA256.txt
          git archive --format=tar --prefix=IronCycle-source/ HEAD | gzip -n -9 > release-evidence/IronCycle-source.tar.gz
          sha256sum release-evidence/IronCycle-source.tar.gz > release-evidence/SOURCE_ARCHIVE_SHA256.txt
          cp release-evidence/IronCycle-source.tar.gz "$RUNNER_TEMP/source-copy.tar.gz"
          cmp --silent release-evidence/IronCycle-source.tar.gz "$RUNNER_TEMP/source-copy.tar.gz"
          echo "SOURCE_COMMIT=$(cat release-evidence/SOURCE_COMMIT.txt)" >> "$GITHUB_ENV"

      - name: Read release identity
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("constants.py").read_text(encoding="utf-8")
          match = re.search(r'^APP_VERSION\s*=\s*["\']([^"\']+)["\']', text, re.M)
          if not match:
              raise SystemExit("APP_VERSION was not found")
          print(match.group(1))
          PY
          )"
          test "$APP_VERSION" = "1.99.14"
          grep -q 'DATABASE_SCHEMA_VERSION = 20' constants.py
          grep -q 'ENTITLEMENT_TEST_CONTROLS = False' constants.py
          ANDROID_VERSION_CODE=$((1300000 + GITHUB_RUN_NUMBER))
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$ANDROID_VERSION_CODE" >> "$GITHUB_ENV"

      - name: Install dependencies and run tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "flet==0.86.5" "msal==1.39.0" "requests==2.34.2" "PyJWT==2.15.1" "cryptography==48.0.0" pytest pyyaml
          python -m py_compile main.py database.py constants.py $(find app components services views -type f -name '*.py' -print | tr '\n' ' ')
          python -m pytest -q
          python - <<'PY'
          import cryptography, jwt, msal, requests
          print("msal", msal.__version__)
          print("requests", requests.__version__)
          print("jwt", jwt.__version__)
          print("cryptography", cryptography.__version__)
          PY
          billing_pubspec="packages/ironcycle-billing/flutter/ironcycle_billing/pubspec.yaml"
          billing_extension="packages/ironcycle-billing"
          test -f "$billing_pubspec"
          test -d "$billing_extension"
          grep -q 'jni_flutter: 1.0.3' "$billing_pubspec"

      - name: Stage local Billing extension for isolated Flet packaging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor
          mkdir -p vendor release-evidence
          python -m pip wheel --no-deps --wheel-dir vendor ./packages/ironcycle-billing
          BILLING_WHEEL="$(find vendor -maxdepth 1 -type f -name 'ironcycle_billing-0.1.1-*.whl' -print -quit)"
          test -n "$BILLING_WHEEL"
          unzip -l "$BILLING_WHEEL" | tee release-evidence/BILLING_WHEEL_CONTENTS.txt
          grep -q 'ironcycle_billing/flutter/ironcycle_billing/pubspec.yaml' release-evidence/BILLING_WHEEL_CONTENTS.txt
          grep -q 'ironcycle_billing/flutter/ironcycle_billing/lib/src/billing.dart' release-evidence/BILLING_WHEEL_CONTENTS.txt
          sha256sum "$BILLING_WHEEL" > release-evidence/BILLING_WHEEL_SHA256.txt
          BILLING_WHEEL_NAME="$(basename "$BILLING_WHEEL")"
          cat > requirements.txt <<REQ
          flet==0.86.5
          msal==1.39.0
          requests==2.34.2
          PyJWT==2.15.1
          cryptography==48.0.0
          ./vendor/$BILLING_WHEEL_NAME
          REQ
          ! grep -q '^\./packages/ironcycle-billing$' requirements.txt
          grep -q '^\./vendor/ironcycle_billing-0.1.1-.*\.whl$' requirements.txt
          python -m pip install --no-deps -r requirements.txt
          python - <<'PY'
          from importlib.metadata import distribution
          dist = distribution("ironcycle-billing")
          names = {str(path) for path in (dist.files or ())}
          required = {
              "ironcycle_billing/flutter/ironcycle_billing/pubspec.yaml",
              "ironcycle_billing/flutter/ironcycle_billing/lib/src/billing.dart",
              "ironcycle_billing/flutter/ironcycle_billing/lib/src/extension.dart",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"Missing installed Billing assets: {missing}")
          for name in sorted(required):
              print(f"Billing distribution asset verified: {name}")
          PY

      - name: Remove repository metadata before Flet packaging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .git
          test ! -e .git

      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ironcycle-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/ironcycle-release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/ironcycle-release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flet build apk --org com.ironcycle --project myapp --product IronCycle --build-version "$APP_VERSION" --build-number "$ANDROID_VERSION_CODE" --android-signing-key-store "$ANDROID_KEYSTORE_PATH" --android-signing-key-store-password "$ANDROID_KEYSTORE_PASSWORD" --android-signing-key-alias "$ANDROID_KEY_ALIAS" --android-signing-key-password "$ANDROID_KEY_PASSWORD" --verbose

      - name: Locate and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find build/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"; test -x "$AAPT"
          VERIFIED_APK="build/apk/IronCycle-${APP_VERSION}-verified.apk"
          cp "$APK_PATH" "$VERIFIED_APK"
          "$APKSIGNER" verify --verbose --print-certs "$VERIFIED_APK" | tee "$RUNNER_TEMP/apk-signature.txt"
          "$AAPT" dump badging "$VERIFIED_APK" | tee "$RUNNER_TEMP/apk-badging.txt"
          "$AAPT" dump permissions "$VERIFIED_APK" | tee "$RUNNER_TEMP/apk-permissions.txt"
          grep -q "package: name='$EXPECTED_PACKAGE_ID'" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "versionName='$APP_VERSION'" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "versionCode='$ANDROID_VERSION_CODE'" "$RUNNER_TEMP/apk-badging.txt"
          grep -q 'com.android.vending.BILLING' "$RUNNER_TEMP/apk-permissions.txt"
          echo "VERIFIED_APK=$VERIFIED_APK" >> "$GITHUB_ENV"

      - name: Build signed AAB
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flet build aab --org com.ironcycle --project myapp --product IronCycle --build-version "$APP_VERSION" --build-number "$ANDROID_VERSION_CODE" --android-signing-key-store "$ANDROID_KEYSTORE_PATH" --android-signing-key-store-password "$ANDROID_KEYSTORE_PASSWORD" --android-signing-key-alias "$ANDROID_KEY_ALIAS" --android-signing-key-password "$ANDROID_KEY_PASSWORD" --verbose

      - name: Locate and verify AAB
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          AAB_PATH="$(find build/aab -type f -name '*.aab' -print -quit)"
          test -n "$AAB_PATH"
          VERIFIED_AAB="build/aab/IronCycle-${APP_VERSION}-google-play.aab"
          cp "$AAB_PATH" "$VERIFIED_AAB"
          jarsigner -verify -verbose -certs "$VERIFIED_AAB" | tee "$RUNNER_TEMP/aab-verify.txt"
          unzip -t "$VERIFIED_AAB" | tee "$RUNNER_TEMP/aab-unzip-test.txt"
          unzip -l "$VERIFIED_AAB" | grep -q 'base/manifest/AndroidManifest.xml'
          unzip -l "$VERIFIED_AAB" | grep -q 'base/dex/classes.dex'
          echo "VERIFIED_AAB=$VERIFIED_AAB" >> "$GITHUB_ENV"

      - name: Create APK and AAB evidence
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "$VERIFIED_APK" "$VERIFIED_AAB" > release-evidence/ANDROID_ARTIFACT_SHA256.txt
          printf 'source_commit=%s\nversion_name=%s\nversion_code=%s\npackage_id=%s\nartifact_target=apk_and_aab\nflutter=3.44.8\nflet=0.86.5\n' "$SOURCE_COMMIT" "$APP_VERSION" "$ANDROID_VERSION_CODE" "$EXPECTED_PACKAGE_ID" > release-evidence/ANDROID_ARTIFACT_INVENTORY.txt
          printf 'IronCycle authentic APK and AAB packaging verification\nCommit: %s\nVersion: %s\nVersion code: %s\nPackage ID: %s\nAPK signer: verified\nAAB signature and structure: verified\nFlutter: 3.44.8\n' "$SOURCE_COMMIT" "$APP_VERSION" "$ANDROID_VERSION_CODE" "$EXPECTED_PACKAGE_ID" > IronCycle_Authentic_Packaging_Verification.txt

      - name: Upload verified APK, AAB, and evidence
        uses: actions/upload-artifact@v4
        with:
          name: IronCycle-${{ env.APP_VERSION }}-android-play-artifacts
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.VERIFIED_APK }}
            ${{ env.VERIFIED_AAB }}
            IronCycle_Authentic_Packaging_Verification.txt
            release-evidence/
