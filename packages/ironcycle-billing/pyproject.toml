[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ironcycle-billing"
version = "0.1.0"
description = "IronCycle Google Play Billing service for Flet"
requires-python = ">=3.10"
dependencies = ["flet==0.86.5"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["ironcycle_billing"]
include-package-data = true
